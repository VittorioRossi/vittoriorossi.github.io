<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype · node becomes the name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script>const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;</script>
<style>
  :root { --ink: #111; --muted: #4f4c46; --paper: #f5f3ee; --line: #d9d5cc; --accent: #2e7d4f; --rule: #1f5e3b; }
  :root[data-theme="dark"] { --ink: #ebe8e1; --muted: #a8a399; --paper: #151614; --line: #34332f; --accent: #7cc79a; --rule: #2e7d4f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #ebe8e1; --muted: #a8a399; --paper: #151614; --line: #34332f; --accent: #7cc79a; --rule: #2e7d4f; }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); color-scheme: light dark; }
  body { margin: 0; border-top: 4px solid var(--rule); color: var(--ink);
    font-family: "Source Serif 4", Charter, Georgia, serif; font-size: 18px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  main { max-width: 680px; margin: 0 auto; padding: 96px 20px 80px; position: relative; }
  h1 { font-size: 2.4em; line-height: 1.1; font-weight: 600; letter-spacing: -.012em; margin: 0; opacity: 0; }
  h1.show { opacity: 1; transition: opacity .5s ease; }
  .role { font-variant: small-caps; letter-spacing: .06em; color: var(--accent); margin-top: 6px; opacity: 0; transform: translateY(6px);
    transition: opacity .7s ease .1s, transform .7s ease .1s; }
  .role.show { opacity: 1; transform: none; }
  p.lede { opacity: .35; }
  #fx, #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  #bg { z-index: -1; } #fx { z-index: 5; }

  .panel { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 6px;
    background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px; font-size: .85em; }
  .panel button { font: inherit; background: none; border: 0; color: var(--muted); padding: 4px 12px; border-radius: 999px; cursor: pointer;
    font-variant: small-caps; letter-spacing: .05em; }
  .panel button.on { background: var(--ink); color: var(--paper); }
  .panel button:hover:not(.on) { color: var(--accent); }
  .note { color: var(--muted); font-style: italic; font-size: .9em; margin-top: 40px; }
  @media (max-width: 520px) { h1 { font-size: 2em; } main { padding-top: 64px; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <h1 id="name">Vittorio Rossi</h1>
  <div class="role" id="role">AI engineer &amp; researcher · Milan</div>
  <p class="lede">I build LLM systems that run in production and study how generative models spend their compute.</p>
  <p class="note">A dot is pulled out of the moving lattice, swells, and bursts into the name. Replay to watch again.</p>
</main>
<div class="panel">
  <button id="replay" class="on">replay</button>
  <button id="theme">theme</button>
</div>
<script>
const root = document.documentElement;
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const clamp = x => Math.max(0, Math.min(1, x));
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const rnd = (a, b) => a + Math.random() * (b - a);
const smoother = x => x * x * x * (x * (6 * x - 15) + 10);
const outBack = x => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2;
const inOut = x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;
const out = x => 1 - (1 - x) ** 3;

const bg = document.getElementById("bg"), bctx = bg.getContext("2d");
const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
const nameEl = document.getElementById("name"), roleEl = document.getElementById("role");
const GAP = 44, CYCLE = 28000, SPREAD = GAP * 2.2, COL = 680;
let W, H, dots = [], accent, ink;

// ---- the site's moving lattice ----
function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [bg, fx]) { c.width = W * dpr; c.height = H * dpr; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); }
  dots = [];
  for (let y = GAP / 2; y < H; y += GAP) for (let x = GAP / 2; x < W; x += GAP)
    dots.push({ x, y, ax: gauss(), bx: gauss(), ay: gauss(), by: gauss(),
      w1: rnd(.12, .3), w2: rnd(.12, .3), p1: rnd(0, 6.3), p2: rnd(0, 6.3), p3: rnd(0, 6.3), p4: rnd(0, 6.3), hide: 0 });
}
function sigma(t) {
  const p = (t % CYCLE) / CYCLE;
  const r = p < .2 ? 0 : p < .45 ? smoother((p - .2) / .25) : p < .6 ? 1 : p < .85 ? 1 - smoother((p - .6) / .25) : 0;
  return r * SPREAD;
}
function pos(d, t) {
  const s = t / 1000, sg = sigma(t);
  return { x: d.x + (d.ax * Math.cos(d.w1 * s + d.p1) + d.bx * Math.sin(d.w2 * s + d.p2)) * .7071 * sg,
           y: d.y + (d.ay * Math.cos(d.w2 * s + d.p3) + d.by * Math.sin(d.w1 * s + d.p4)) * .7071 * sg };
}
const dim = d => { const l = (W - COL) / 2; return d.x > l && d.x < l + COL ? .09 : .24; };
// Start late in denoising: the grid is readable but still moving, and settles as the name forms.
const OFFSET = CYCLE * .755;
const clock = now => now + OFFSET;
function drawLattice(t) {
  bctx.clearRect(0, 0, W, H); bctx.fillStyle = accent;
  for (const d of dots) {
    if (d.hide >= 1) continue;
    const p = pos(d, t);
    bctx.globalAlpha = dim(d) * (1 - d.hide);
    bctx.beginPath(); bctx.arc(p.x, p.y, 1.4, 0, 6.283); bctx.fill();
  }
}

// ---- the name ----
function textRect(el) { const g = document.createRange(); g.selectNodeContents(el); return g.getBoundingClientRect(); }
function sampleName(el, step) {
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  const off = document.createElement("canvas"), o = off.getContext("2d");
  off.width = Math.ceil(r.width); off.height = Math.ceil(r.height);
  o.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  o.letterSpacing = cs.letterSpacing;
  // Match CSS: the font's content box is centred in the line box, text sits on its baseline.
  const m = o.measureText(el.textContent), asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
  const lh = parseFloat(cs.lineHeight) || r.height;
  o.textBaseline = "alphabetic"; o.fillStyle = "#000";
  o.fillText(el.textContent, 0, (lh - asc - desc) / 2 + asc);
  const data = o.getImageData(0, 0, off.width, off.height).data, pts = [];
  for (let y = 0; y < off.height; y += step) for (let x = 0; x < off.width; x += step)
    if (data[(y * off.width + x) * 4 + 3] > 140) pts.push({ x: r.left + x, y: r.top + y });
  return pts;
}

// Timeline (ms after the pull starts)
const WAIT = 900, PULL = 1100, GROW = 650, FLY = 1300, SETTLE = 500, BACK = 900;
let show = null;

function start(now) {
  nameEl.classList.remove("show"); roleEl.classList.remove("show");
  for (const d of dots) d.hide = 0;
  const tr = textRect(nameEl);
  const anchor = { x: tr.left + tr.width * .62, y: tr.top + tr.height / 2 };
  // Pull a random dot from the left margin; on narrow screens, any dot above the fold.
  const l = (W - COL) / 2;
  let pool = dots.filter(d => d.x < l - GAP / 2 && d.y < H * .8);
  if (!pool.length) pool = dots.filter(d => d.y < H * .6);
  const best = pool[Math.floor(Math.random() * pool.length)];
  const pts = sampleName(nameEl, W < 520 ? 3 : 2);
  show = { t0: now + WAIT, dot: best, anchor, pts, parts: null, bend: gauss() * 60 };
}

function frame(now) {
  const t = clock(now);
  drawLattice(t);
  ctx.clearRect(0, 0, W, H);
  if (show && now >= show.t0) {
    const e = now - show.t0, d = show.dot, a = show.anchor;
    // 1. pull: the dot leaves the lattice and glides to the name, brightening
    const k = inOut(clamp(e / PULL));
    d.hide = e < PULL + GROW + FLY + SETTLE ? 1 : 1 - clamp((e - PULL - GROW - FLY - SETTLE) / BACK);
    const p0 = pos(d, t);
    const mx = (p0.x + a.x) / 2, my = Math.min(p0.y, a.y) - 40 + show.bend * .3;
    const q = 1 - k, nx = q * q * p0.x + 2 * q * k * mx + k * k * a.x, ny = q * q * p0.y + 2 * q * k * my + k * k * a.y;
    // 2. swell at the anchor, 3. empty out as particles leave
    const g = clamp((e - PULL) / GROW), leave = clamp((e - PULL - GROW) / 450);
    const rad = 1.4 + 2.6 * smoother(clamp(e / 400)) + 12 * outBack(g) * (1 - out(leave));
    const alpha = (dim(d) + (.9 - dim(d)) * clamp(e / 300)) * (1 - leave * .7);
    if (rad > .3 && leave < 1) {
      ctx.fillStyle = accent;
      ctx.globalAlpha = .18 * alpha; ctx.beginPath(); ctx.arc(nx, ny, rad * 1.9, 0, 6.283); ctx.fill();
      ctx.globalAlpha = alpha; ctx.beginPath(); ctx.arc(nx, ny, rad, 0, 6.283); ctx.fill();
    }
    // 4. particles flow from the node into the letters
    const pe = e - PULL - GROW;
    if (pe > 0) {
      show.parts ??= show.pts.map(p => {
        const sx = a.x + gauss() * 3, sy = a.y + gauss() * 3;
        return { sx, sy, mx: (sx + p.x) / 2 + gauss() * 70, my: (sy + p.y) / 2 + gauss() * 50, tx: p.x, ty: p.y, delay: Math.random() * 450 };
      });
      const fade = clamp((pe - FLY - 150) / SETTLE);
      if (fade < 1) for (const p of show.parts) {
        const m = inOut(clamp((pe - p.delay) / (FLY - 450)));
        if (m <= 0) continue;
        const r = 1 - m, x = r * r * p.sx + 2 * r * m * p.mx + m * m * p.tx, y = r * r * p.sy + 2 * r * m * p.my + m * m * p.ty;
        ctx.globalAlpha = (1 - fade) * .95; ctx.fillStyle = m > .85 ? ink : accent;
        ctx.fillRect(x - .9, y - .9, 1.8, 1.8);
      }
      if (pe > FLY - 100) { nameEl.classList.add("show"); roleEl.classList.add("show"); }
    }
    if (e > PULL + GROW + FLY + SETTLE + BACK) { d.hide = 0; show = null; }
  }
  requestAnimationFrame(frame);
}

function colors() { accent = css("--accent"); ink = css("--ink"); }
document.getElementById("replay").onclick = () => start(performance.now());
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; localStorage.setItem("theme", root.dataset.theme);
  colors();
};
addEventListener("resize", () => { layout(); start(performance.now()); });
document.fonts.load('600 43px "Source Serif 4"').then(() => document.fonts.ready).then(() => {
  colors(); layout(); start(performance.now()); requestAnimationFrame(frame);
});
</script>
<script src="/draft.js" defer></script>
</body>
</html>
